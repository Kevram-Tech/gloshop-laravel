version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gloshop-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - gloshop-network
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:alpine
    container_name: gloshop-nginx
    restart: unless-stopped
    ports:
      - "6500:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - gloshop-network
    depends_on:
      - app

  redis:
    image: redis:alpine
    container_name: gloshop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - gloshop-network

networks:
  gloshop-network:
    driver: bridge

