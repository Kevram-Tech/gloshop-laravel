name: Deploy GloShop Laravel to Production (Port 6500)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Create deployment archive
        run: |
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='node_modules' \
              --exclude='vendor' \
              --exclude='.env' \
              --exclude='docker.env' \
              --exclude='storage/logs/*' \
              --exclude='storage/framework/cache/*' \
              --exclude='storage/framework/sessions/*' \
              --exclude='storage/framework/views/*' \
              --exclude='bootstrap/cache/*' \
              --exclude='tests' \
              --exclude='.phpunit.cache' \
              --exclude='*.log' \
              --exclude='deploy.tar.gz' \
              -czf /tmp/deploy.tar.gz .
          mv /tmp/deploy.tar.gz ./deploy.tar.gz

      - name: 📤 Upload code to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT || 22 }}
          source: "deploy.tar.gz" # On n'envoie QUE le code (léger)
          target: ${{ secrets.SFTP_ADMIN_DEPLOY_PATH || '/var/www/gloshop-laravel' }}
          timeout: "120s" # Augmentation du timeout au cas où

      - name: 🐳 Deploy with Docker on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT || 22 }}
          timeout: "300s" # Timeout plus long pour le build
          command_timeout: "30m" # Le build peut prendre du temps
          script: |
            set -e
            
            DEPLOY_PATH="${{ secrets.VPS_DEPLOY_PATH || '/var/www/gloshop-laravel' }}"
            cd $DEPLOY_PATH
            
            echo "=========================================="
            echo "🚀 Déploiement GloShop Laravel (Port 6500)"
            echo "=========================================="
            
            # 1. Sauvegarder docker.env s'il existe
            if [ -f docker.env ]; then
              echo "💾 Sauvegarde de docker.env..."
              cp docker.env docker.env.backup
            fi
            
            # Extraction du code
            echo "📦 Extraction des fichiers..."
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz
            
            # 3. Restaurer docker.env si sauvegardé
            if [ -f docker.env.backup ]; then
              echo "💾 Restauration de docker.env..."
              mv docker.env.backup docker.env
            elif [ ! -f docker.env ] && [ -f docker.env.example ]; then
              echo "⚠️  docker.env n'existe pas. Création depuis docker.env.example..."
              cp docker.env.example docker.env
              echo "⚠️  IMPORTANT: Configurez docker.env avec vos valeurs réelles!"
            fi
            
            # 4. Vérifier que Docker est installé
            if ! command -v docker &> /dev/null; then
              echo "❌ Docker n'est pas installé sur le serveur"
              exit 1
            fi
            
            # 5. Détecter docker-compose ou docker compose
            if docker compose version &> /dev/null; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose &> /dev/null; then
              COMPOSE_CMD="docker-compose"
            else
              echo "❌ Docker Compose n'est pas installé"
              exit 1
            fi
            
            echo "✅ Utilisation de: $COMPOSE_CMD"
            
            # 6. Nettoyer le cache Laravel
            echo "🧹 Nettoyage du cache..."
            rm -f bootstrap/cache/config.php
            rm -f bootstrap/cache/services.php
            rm -f bootstrap/cache/packages.php
            rm -f bootstrap/cache/routes-v7.php
            rm -f bootstrap/cache/routes.php
            
            # 7. Arrêter les conteneurs existants
            echo "🛑 Arrêt des conteneurs existants..."
            $COMPOSE_CMD -f docker-compose.prod.yml down 2>/dev/null || true
            
            # 8. Construire l'image Docker
            echo "🏗️ Construction de l'image Docker..."
            $COMPOSE_CMD -f docker-compose.prod.yml build --no-cache app
            
            # 9. Démarrer les conteneurs
            echo "▶️ Démarrage des conteneurs..."
            $COMPOSE_CMD -f docker-compose.prod.yml up -d
            
            # 10. Attendre que les conteneurs soient prêts
            echo "⏳ Attente du démarrage des conteneurs..."
            sleep 20
            
            # 11. Vérifier que le conteneur est prêt
            CONTAINER_NAME="gloshop_laravel_app"
            MAX_ATTEMPTS=30
            ATTEMPT=0
            
            while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
              if docker exec $CONTAINER_NAME php artisan --version &> /dev/null; then
                echo "✅ Conteneur prêt"
                break
              fi
              ATTEMPT=$((ATTEMPT + 1))
              echo "   Attente... ($ATTEMPT/$MAX_ATTEMPTS)"
              sleep 2
            done
            
            if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
              echo "⚠️  Avertissement: Le conteneur peut ne pas être complètement prêt"
            fi
            
            # 12. Installer les dépendances Composer
            echo "📦 Installation des dépendances Composer..."
            # Vérifier que composer.json existe
            if docker exec $CONTAINER_NAME test -f composer.json; then
              echo "✅ composer.json trouvé"
              # Installer les dépendances
              docker exec $CONTAINER_NAME composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist || {
                echo "⚠️  Erreur lors de l'installation, tentative avec --ignore-platform-reqs..."
                docker exec $CONTAINER_NAME composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --ignore-platform-reqs || {
                  echo "❌ Échec de l'installation des dépendances Composer"
                  exit 1
                }
              }
              echo "✅ Dépendances Composer installées"
            else
              echo "❌ composer.json introuvable!"
              exit 1
            fi
            
            # 13. Générer la clé d'application si nécessaire
            echo "🔑 Génération de la clé d'application..."
            docker exec $CONTAINER_NAME php artisan key:generate --force || {
              echo "⚠️  La clé existe déjà ou erreur lors de la génération"
            }
            
            # 14. Optimisations Laravel
            echo "✨ Optimisation Laravel..."
            docker exec $CONTAINER_NAME php artisan config:clear || true
            docker exec $CONTAINER_NAME php artisan view:clear || true
            docker exec $CONTAINER_NAME php artisan route:clear || true
            docker exec $CONTAINER_NAME php artisan cache:clear || true
            
            # Cache pour la production
            docker exec $CONTAINER_NAME php artisan config:cache || true
            docker exec $CONTAINER_NAME php artisan route:cache || true
            docker exec $CONTAINER_NAME php artisan view:cache || true
            
            # Créer le lien de stockage
            docker exec $CONTAINER_NAME php artisan storage:link || true
            
            # Permissions
            docker exec $CONTAINER_NAME chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache || true
            docker exec $CONTAINER_NAME chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache || true
            
            # 15. Vérifier le statut
            echo ""
            echo "=========================================="
            echo "✅ Déploiement terminé avec succès!"
            echo "=========================================="
            echo "Application accessible sur le port 6500"
            echo ""
            echo "Statut des conteneurs:"
            $COMPOSE_CMD -f docker-compose.prod.yml ps
            echo ""
            echo "Dernières lignes des logs:"
            docker logs --tail 20 $CONTAINER_NAME || true

      - name: ✅ Deployment Status
        run: |
          echo "✅ Déploiement terminé!"
          echo "🌐 Application accessible sur: http://${{ secrets.SFTP_HOST }}:6500"
