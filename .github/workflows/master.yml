name: Deploy GloShop Laravel to Production (Port 6500)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Create deployment archive
        run: |
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='node_modules' \
              --exclude='vendor' \
              --exclude='.env' \
              --exclude='storage/logs/*' \
              --exclude='storage/framework/cache/*' \
              --exclude='storage/framework/sessions/*' \
              --exclude='storage/framework/views/*' \
              --exclude='bootstrap/cache/*' \
              --exclude='tests' \
              --exclude='.phpunit.cache' \
              --exclude='*.log' \
              --exclude='deploy.tar.gz' \
              --exclude='docker-compose*.yml' \
              --exclude='Dockerfile*' \
              --exclude='docker/' \
              -czf /tmp/deploy.tar.gz .
          mv /tmp/deploy.tar.gz ./deploy.tar.gz

      - name: 📤 Upload code to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT || 22 }}
          source: "deploy.tar.gz"
          target: ${{ secrets.SFTP_ADMIN_DEPLOY_PATH || '/var/www/gloshop-laravel' }}
          timeout: "300s"

      - name: 🚀 Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT || 22 }}
          timeout: "600s"
          command_timeout: "30m"
          script: |
            set -e
            
            DEPLOY_PATH="${{ secrets.SFTP_ADMIN_DEPLOY_PATH || '/var/www/gloshop-laravel' }}"
            cd $DEPLOY_PATH
            
            echo "=========================================="
            echo "🚀 Déploiement GloShop Laravel (Port 6500)"
            echo "=========================================="
            
            # 1. Sauvegarder .env s'il existe
            if [ -f .env ]; then
              echo "💾 Sauvegarde de .env..."
              cp .env .env.backup
            fi
            
            # 2. Extraction du code
            echo "📦 Extraction des fichiers..."
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz
            
            # 3. Restaurer .env si sauvegardé
            if [ -f .env.backup ]; then
              echo "💾 Restauration de .env..."
              mv .env.backup .env
            elif [ ! -f .env ] && [ -f .env.example ]; then
              echo "⚠️  .env n'existe pas. Création depuis .env.example..."
              cp .env.example .env
              echo "⚠️  IMPORTANT: Configurez .env avec vos valeurs réelles!"
            fi
            
            # 4. Vérifier que PHP est installé
            if ! command -v php &> /dev/null; then
              echo "❌ PHP n'est pas installé sur le serveur"
              exit 1
            fi
            
            PHP_VERSION=$(php -r 'echo PHP_VERSION;')
            echo "✅ PHP version: $PHP_VERSION"
            
            # 5. Vérifier que Composer est installé
            if ! command -v composer &> /dev/null; then
              echo "❌ Composer n'est pas installé sur le serveur"
              exit 1
            fi
            
            echo "✅ Composer installé"
            
            # 6. Nettoyer le cache Laravel
            echo "🧹 Nettoyage du cache..."
            rm -f bootstrap/cache/config.php
            rm -f bootstrap/cache/services.php
            rm -f bootstrap/cache/packages.php
            rm -f bootstrap/cache/routes-v7.php
            rm -f bootstrap/cache/routes.php
            
            # 7. Installer les dépendances Composer
            echo "📦 Installation des dépendances Composer..."
            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist || {
              echo "⚠️  Tentative avec --ignore-platform-reqs..."
              composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --ignore-platform-reqs
            }
            
            # 8. Générer la clé d'application si nécessaire
            echo "🔑 Génération de la clé d'application..."
            if ! grep -q "APP_KEY=base64:" .env 2>/dev/null || grep -q "^APP_KEY=$" .env; then
              php artisan key:generate --force || true
              echo "✅ Clé d'application générée"
            else
              echo "✅ Clé d'application déjà présente"
            fi
            
            # 9. Configurer les permissions
            echo "🔐 Configuration des permissions..."
            chown -R www-data:www-data storage bootstrap/cache || true
            chmod -R 775 storage bootstrap/cache || true
            
            # 10. Optimisations Laravel
            echo "✨ Optimisation Laravel..."
            php artisan config:clear || true
            php artisan view:clear || true
            php artisan route:clear || true
            php artisan cache:clear || true
            
            # Cache pour la production
            php artisan config:cache || true
            php artisan route:cache || true
            php artisan view:cache || true
            
            # Créer le lien de stockage
            php artisan storage:link || true
            
            # 11. Vérification finale des permissions
            chown -R www-data:www-data storage bootstrap/cache || true
            chmod -R 775 storage bootstrap/cache || true
            
            # 12. Test de santé de l'application
            echo "🏥 Test de santé de l'application..."
            sleep 3
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:6500 || echo "000")
            if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "302" ] || [ "$HTTP_STATUS" = "301" ]; then
              echo "✅ Application répond correctement (HTTP $HTTP_STATUS)"
            else
              echo "⚠️  Application répond avec HTTP $HTTP_STATUS"
              echo "Vérification des logs pour diagnostiquer..."
              tail -30 storage/logs/laravel.log 2>/dev/null | grep -i "error\|exception\|fatal" | tail -10 || echo "Aucune erreur récente dans les logs"
            fi
            
            # 13. Vérifier le statut
            echo ""
            echo "=========================================="
            echo "✅ Déploiement terminé avec succès!"
            echo "=========================================="
            echo "Application accessible sur le port 6500"
            echo ""
            echo "Vérifications:"
            echo "- PHP version: $(php -v | head -1)"
            echo "- Composer version: $(composer --version)"
            echo "- Permissions storage: $(ls -ld storage | awk '{print $1, $3, $4}')"
            echo ""
            echo "Dernières lignes des logs:"
            tail -20 storage/logs/laravel.log 2>/dev/null || echo "Aucun log disponible"

      - name: ✅ Deployment Status
        run: |
          echo "✅ Déploiement terminé!"
          echo "🌐 Application accessible sur: http://${{ secrets.SFTP_HOST }}:6500"
