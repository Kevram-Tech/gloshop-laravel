name: Deploy GloShop Laravel to Production (Port 6500)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Create deployment archive
        run: |
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='node_modules' \
              --exclude='vendor' \
              --exclude='.env' \
              --exclude='.env.*' \
              --exclude='storage/logs/*' \
              --exclude='storage/framework/cache/*' \
              --exclude='storage/framework/sessions/*' \
              --exclude='storage/framework/views/*' \
              --exclude='bootstrap/cache/*' \
              --exclude='tests' \
              --exclude='.phpunit.cache' \
              --exclude='*.log' \
              --exclude='deploy.tar.gz' \
              --exclude='start-local.ps1' \
              --exclude='DOCKER_SETUP.md' \
              --exclude='.env.docker.example' \
              -czf /tmp/deploy.tar.gz .
          mv /tmp/deploy.tar.gz ./deploy.tar.gz
          ls -lh deploy.tar.gz

      - name: 📤 Upload code to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT || 22 }}
          source: "deploy.tar.gz"
          target: ${{ secrets.SFTP_ADMIN_DEPLOY_PATH || '/var/www/gloshop-laravel' }}
          timeout: "300s"
          strip_components: 0

      - name: 🚀 Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT || 22 }}
          timeout: "600s"
          command_timeout: "30m"
          script: |
            set -e
            
            DEPLOY_PATH="${{ secrets.SFTP_ADMIN_DEPLOY_PATH || '/var/www/gloshop-laravel' }}"
            
            # Créer le répertoire s'il n'existe pas
            if [ ! -d "$DEPLOY_PATH" ]; then
              echo "📁 Création du répertoire de déploiement..."
              sudo mkdir -p $DEPLOY_PATH
              sudo chown -R $USER:$USER $DEPLOY_PATH || true
            fi
            
            cd $DEPLOY_PATH
            
            echo "=========================================="
            echo "🚀 Déploiement GloShop Laravel (Port 6500)"
            echo "=========================================="
            
            # 1. Sauvegarder .env s'il existe
            if [ -f .env ]; then
              echo "💾 Sauvegarde de .env..."
              cp .env .env.backup
            fi
            
            # 2. Extraction du code
            echo "📦 Extraction des fichiers..."
            if [ ! -f deploy.tar.gz ]; then
              echo "❌ Fichier deploy.tar.gz introuvable!"
              exit 1
            fi
            tar -xzf deploy.tar.gz
            rm -f deploy.tar.gz
            echo "✅ Fichiers extraits"
            
            # 3. Restaurer .env si sauvegardé
            if [ -f .env.backup ]; then
              echo "💾 Restauration de .env..."
              mv .env.backup .env
            elif [ ! -f .env ] && [ -f .env.example ]; then
              echo "⚠️  .env n'existe pas. Création depuis .env.example..."
              cp .env.example .env
              echo "⚠️  IMPORTANT: Configurez .env avec vos valeurs réelles!"
            fi
            
            # Vérifier que .env existe et est lisible
            if [ ! -f .env ]; then
              echo "❌ ERREUR: .env n'existe toujours pas après restauration!"
              exit 1
            fi
            
            echo "✅ .env présent: $(ls -lh .env | awk '{print $5, $9}')"
            
            # 4. Vérifier que Docker est installé
            if ! command -v docker &> /dev/null; then
              echo "❌ Docker n'est pas installé sur le serveur"
              exit 1
            fi
            
            echo "✅ Docker installé: $(docker --version)"
            
            # 5. Vérifier que Docker Compose est disponible
            if docker compose version &> /dev/null; then
              COMPOSE_CMD="docker compose"
              echo "✅ Docker Compose v2 disponible"
            elif docker-compose version &> /dev/null; then
              COMPOSE_CMD="docker-compose"
              echo "✅ Docker Compose v1 disponible"
            else
              echo "❌ Docker Compose n'est pas installé"
              exit 1
            fi
            
            # 6. Arrêter les conteneurs existants
            echo "🛑 Arrêt des conteneurs existants..."
            $COMPOSE_CMD down || true
            
            # 7. Nettoyer le cache Laravel
            echo "🧹 Nettoyage du cache..."
            rm -f bootstrap/cache/config.php
            rm -f bootstrap/cache/services.php
            rm -f bootstrap/cache/packages.php
            rm -f bootstrap/cache/routes-v7.php
            rm -f bootstrap/cache/routes.php
            
            # 8. Configurer les permissions
            echo "🔐 Configuration des permissions..."
            mkdir -p storage/app/public
            mkdir -p storage/framework/cache/data
            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/views
            mkdir -p storage/logs
            mkdir -p bootstrap/cache
            
            # 9. Construire les images Docker
            echo "🔨 Construction des images Docker..."
            $COMPOSE_CMD build --no-cache
            
            # 10. Démarrer les conteneurs
            echo "🚀 Démarrage des conteneurs..."
            $COMPOSE_CMD up -d
            
            # Vérifier que les conteneurs sont démarrés
            echo "⏳ Vérification du démarrage des conteneurs..."
            sleep 5
            if ! $COMPOSE_CMD ps | grep -q "Up"; then
              echo "⚠️  Certains conteneurs ne sont pas démarrés"
              $COMPOSE_CMD ps
              echo "Logs:"
              $COMPOSE_CMD logs --tail=20
            fi
            
            # 11. Attendre que les conteneurs soient prêts
            echo "⏳ Attente que les conteneurs soient prêts..."
            sleep 10
            
            # 12. Installer les dépendances Composer dans le conteneur
            echo "📦 Installation des dépendances Composer..."
            $COMPOSE_CMD exec -T app composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist || {
              echo "⚠️  Tentative avec --ignore-platform-reqs..."
              $COMPOSE_CMD exec -T app composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --ignore-platform-reqs
            }
            
            # 13. Générer la clé d'application si nécessaire
            echo "🔑 Génération de la clé d'application..."
            if ! grep -q "APP_KEY=base64:" .env 2>/dev/null || grep -q "^APP_KEY=$" .env; then
              $COMPOSE_CMD exec -T app php artisan key:generate --force || true
              echo "✅ Clé d'application générée"
            else
              echo "✅ Clé d'application déjà présente"
            fi
            
            # 14. Optimisations Laravel dans le conteneur
            echo "✨ Optimisation Laravel..."
            $COMPOSE_CMD exec -T app php artisan config:clear || true
            $COMPOSE_CMD exec -T app php artisan view:clear || true
            $COMPOSE_CMD exec -T app php artisan route:clear || true
            $COMPOSE_CMD exec -T app php artisan cache:clear || true
            
            # Cache pour la production
            $COMPOSE_CMD exec -T app php artisan config:cache || true
            $COMPOSE_CMD exec -T app php artisan route:cache || true
            $COMPOSE_CMD exec -T app php artisan view:cache || true
            
            # Créer le lien de stockage
            $COMPOSE_CMD exec -T app php artisan storage:link || true
            
            # 15. Exécuter les migrations si nécessaire
            echo "🗄️  Vérification des migrations..."
            $COMPOSE_CMD exec -T app php artisan migrate --force || echo "⚠️  Erreur lors des migrations (peut être normal si déjà à jour)"
            
            # 16. Configurer les permissions dans le conteneur
            echo "🔐 Configuration des permissions dans le conteneur..."
            $COMPOSE_CMD exec -T app chown -R www-data:www-data storage bootstrap/cache || true
            $COMPOSE_CMD exec -T app chmod -R 775 storage bootstrap/cache || true
            
            # 17. Test de santé de l'application
            echo "🏥 Test de santé de l'application..."
            sleep 15
            
            # Attendre que les conteneurs soient vraiment prêts
            echo "⏳ Attente que les services soient prêts..."
            for i in {1..10}; do
              if $COMPOSE_CMD exec -T app php artisan --version &>/dev/null; then
                echo "✅ Services prêts"
                break
              fi
              echo "Tentative $i/10..."
              sleep 2
            done
            
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:6500 || echo "000")
            if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "302" ] || [ "$HTTP_STATUS" = "301" ]; then
              echo "✅ Application répond correctement (HTTP $HTTP_STATUS)"
            else
              echo "⚠️  Application répond avec HTTP $HTTP_STATUS"
              echo "🔍 Diagnostic approfondi..."
              
              # Diagnostic détaillé
              echo ""
              echo "=== Statut des conteneurs ==="
              $COMPOSE_CMD ps
              
              echo ""
              echo "=== Logs App (dernières 50 lignes) ==="
              $COMPOSE_CMD logs --tail=50 app || true
              
              echo ""
              echo "=== Logs Nginx (dernières 50 lignes) ==="
              $COMPOSE_CMD logs --tail=50 nginx || true
              
              echo ""
              echo "=== Vérification .env ==="
              if $COMPOSE_CMD exec -T app test -f .env; then
                echo "✅ .env existe"
                $COMPOSE_CMD exec -T app grep "^APP_KEY=" .env || echo "❌ APP_KEY manquante"
                $COMPOSE_CMD exec -T app grep "^DB_" .env | head -5 || echo "Variables DB non trouvées"
              else
                echo "❌ .env n'existe pas dans le conteneur"
              fi
              
              echo ""
              echo "=== Vérification vendor ==="
              if $COMPOSE_CMD exec -T app test -d vendor; then
                echo "✅ vendor/ existe"
                $COMPOSE_CMD exec -T app test -f vendor/autoload.php && echo "✅ autoload.php existe" || echo "❌ autoload.php manquant"
              else
                echo "❌ vendor/ n'existe pas"
              fi
              
              echo ""
              echo "=== Logs Laravel (erreurs) ==="
              $COMPOSE_CMD exec -T app tail -100 storage/logs/laravel.log 2>/dev/null | grep -i "error\|exception\|fatal" | tail -20 || echo "Aucune erreur récente"
              
              echo ""
              echo "=== Tentative de réparation automatique ==="
              
              # Réparation 1: Vérifier et réinstaller vendor si nécessaire
              if [ ! -d vendor ] || ! $COMPOSE_CMD exec -T app test -f vendor/autoload.php; then
                echo "Réinstallation des dépendances..."
                $COMPOSE_CMD exec -T app composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --ignore-platform-reqs || true
              fi
              
              # Réparation 2: Vérifier APP_KEY
              if ! $COMPOSE_CMD exec -T app grep -q "APP_KEY=base64:" .env 2>/dev/null; then
                echo "Génération de APP_KEY..."
                $COMPOSE_CMD exec -T app php artisan key:generate --force || true
              fi
              
              # Réparation 3: Nettoyer et recréer les caches
              echo "Nettoyage des caches..."
              $COMPOSE_CMD exec -T app php artisan config:clear || true
              $COMPOSE_CMD exec -T app php artisan cache:clear || true
              $COMPOSE_CMD exec -T app php artisan route:clear || true
              $COMPOSE_CMD exec -T app php artisan view:clear || true
              
              # Réparation 4: Recréer les caches
              echo "Recréation des caches..."
              $COMPOSE_CMD exec -T app php artisan config:cache || true
              $COMPOSE_CMD exec -T app php artisan route:cache || true
              $COMPOSE_CMD exec -T app php artisan view:cache || true
              
              # Réparation 5: Permissions
              echo "Correction des permissions..."
              $COMPOSE_CMD exec -T app chown -R www-data:www-data storage bootstrap/cache || true
              $COMPOSE_CMD exec -T app chmod -R 775 storage bootstrap/cache || true
              
              # Réparation 6: Redémarrer les conteneurs
              echo "Redémarrage des conteneurs..."
              $COMPOSE_CMD restart app nginx || true
              
              sleep 10
              
              # Test après réparation
              HTTP_STATUS_AFTER=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:6500 || echo "000")
              if [ "$HTTP_STATUS_AFTER" = "200" ] || [ "$HTTP_STATUS_AFTER" = "302" ] || [ "$HTTP_STATUS_AFTER" = "301" ]; then
                echo "✅ Application réparée! (HTTP $HTTP_STATUS_AFTER)"
              else
                echo "❌ Application toujours en erreur (HTTP $HTTP_STATUS_AFTER)"
                echo ""
                echo "=== Dernières erreurs Laravel ==="
                $COMPOSE_CMD exec -T app tail -100 storage/logs/laravel.log 2>/dev/null | grep -A 5 -B 5 -i "error\|exception\|fatal" | tail -30 || echo "Aucune erreur trouvée"
              fi
            fi
            
            # 18. Vérifier le statut
            echo ""
            echo "=========================================="
            echo "✅ Déploiement terminé avec succès!"
            echo "=========================================="
            echo "Application accessible sur le port 6500"
            echo ""
            echo "Statut des conteneurs:"
            $COMPOSE_CMD ps
            echo ""
            echo "Vérifications:"
            echo "- Docker version: $(docker --version)"
            echo "- Conteneurs actifs:"
            docker ps --filter "name=gloshop" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo ""
            echo "Dernières lignes des logs:"
            $COMPOSE_CMD exec -T app tail -20 storage/logs/laravel.log 2>/dev/null || echo "Aucun log disponible"

      - name: ✅ Deployment Status
        run: |
          echo "✅ Déploiement terminé!"
          echo "🌐 Application accessible sur: http://${{ secrets.SFTP_HOST }}:6500"
