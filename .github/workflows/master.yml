name: Deploy GloShop Laravel API to Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      # ÉTAPE SUPPRIMÉE : On ne build plus l'image Docker ici pour éviter d'envoyer un fichier de 1Go
      
      - name: 📦 Create deployment archive
        run: |
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='node_modules' \
              --exclude='vendor' \
              --exclude='.env' \
              --exclude='docker.env' \
              --exclude='storage/logs' \
              --exclude='storage/framework/cache' \
              --exclude='storage/framework/sessions' \
              --exclude='storage/framework/views' \
              --exclude='bootstrap/cache' \
              --exclude='tests' \
              --exclude='.phpunit.cache' \
              --exclude='certbot_data' \
              --exclude='certbot_www' \
              --exclude='deploy.tar.gz' \
              --exclude='*.log' \
              -czf /tmp/deploy.tar.gz .
          mv /tmp/deploy.tar.gz ./deploy.tar.gz

      - name: 📤 Upload source code to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT || 22 }}
          source: "deploy.tar.gz" # On n'envoie QUE le code (léger)
          target: ${{ secrets.SFTP_ADMIN_DEPLOY_PATH || '/var/www/gloshop-laravel' }}
          timeout: "120s" # Augmentation du timeout au cas où

      - name: 📂 Extract and Build on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT || 22 }}
          timeout: "300s" # Timeout plus long pour le build
          command_timeout: "30m" # Le build peut prendre du temps
          script: |
            cd ${{ secrets.SFTP_ADMIN_DEPLOY_PATH || '/var/www/gloshop-laravel' }}
            
            # Extraction du code
            echo "📦 Extraction des fichiers..."
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz

            # Note: On a supprimé 'docker load' car on va construire l'image juste après

            # Vérifier que docker.env existe
            if [ ! -f docker.env ]; then
              echo "⚠️  docker.env n'existe pas. Création depuis docker.env.example..."
              if [ -f docker.env.example ]; then
                cp docker.env.example docker.env
              fi
            fi

            # Vérifier et mettre à jour APP_URL avec le port 8082
            if [ -f docker.env ]; then
              echo "🔧 Updating APP_URL to use port 8082..."
              sed -i 's|APP_URL=.*|APP_URL=http://72.60.188.146:8082|g' docker.env || true
            fi
            
            echo "📦 Deployments..."
            # Utilisation du script de déploiement intelligent qu'on a créé précédemment
            # Assurez-vous que le script est exécutable
            chmod +x deploy-prod.sh
            ./deploy-prod.sh
            
            # Vérifier que le port 8082 est ouvert dans le firewall
            echo "🔥 Checking firewall for port 8082..."
            if command -v ufw &> /dev/null; then
              sudo ufw allow 8082/tcp || true
              echo "✅ Port 8082 opened in UFW"
            elif command -v firewall-cmd &> /dev/null; then
              sudo firewall-cmd --permanent --add-port=8082/tcp || true
              sudo firewall-cmd --reload || true
              echo "✅ Port 8082 opened in firewalld"
            fi
            
            # Vérifier que le conteneur écoute sur le port 8082
            echo "🔍 Verifying container is listening on port 8082..."
            sleep 5
            if docker ps | grep -q "gloshop_laravel_app"; then
              PORT_CHECK=$(docker port gloshop_laravel_app 2>&1 | grep "8082" || echo "")
              if [ -n "$PORT_CHECK" ]; then
                echo "✅ Container is listening on port 8082: $PORT_CHECK"
              else
                echo "⚠️  Warning: Port 8082 mapping not found. Checking container status..."
                docker ps | grep gloshop_laravel_app
              fi
            fi